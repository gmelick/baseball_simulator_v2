# =============================================================================
# MLB Baseball Simulation Platform — CI Pipeline (SIM-146)
#
# Triggers:
#   push    → any branch  (lint + unit-tests + regression + docker-build check)
#   PR      → main        (all jobs required; docker-build check blocks merge)
#
# Job graph:
#   lint ──────────────┐
#   type-check ────────┤──▶ docker-build-check
#   unit-tests ────────┤
#   regression ────────┘   (needs: unit-tests)
#
# Coverage gate: 80% line coverage required on similarity/ + pipeline/
# Regression gate: golden-file snapshot comparison for all 9 similarity engines
# =============================================================================

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

# Cancel in-flight runs for the same ref (save CI minutes on force-pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  # Minimum line-coverage threshold for similarity/ + pipeline/ modules
  COVERAGE_GATE: 80

# ---------------------------------------------------------------------------
# Job 1 — Lint
# Fast-fail: ruff check + ruff format check in <30s
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4,<1"

      - name: Ruff — lint check
        run: ruff check . --output-format=github

      - name: Ruff — format check (no diff)
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2 — Static type checking
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime deps + mypy
        run: |
          pip install -r requirements.txt
          pip install "mypy>=1.8,<2" types-redis types-requests

      - name: Mypy — similarity, pipeline, api
        run: |
          mypy similarity/ pipeline/ api/ \
            --ignore-missing-imports \
            --python-version 3.11 \
            --warn-return-any \
            --no-error-summary

  # ---------------------------------------------------------------------------
  # Job 3 — Unit tests + coverage gate
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --timeout=30 \
            --strict-markers \
            --cov=similarity \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junit-xml=test-results-unit.xml

      - name: Enforce coverage gate (${{ env.COVERAGE_GATE }}%)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("coverage.xml")
          rate = float(tree.getroot().get("line-rate", 0)) * 100
          gate = int("${{ env.COVERAGE_GATE }}")
          print(f"Line coverage: {rate:.1f}%  (gate: {gate}%)")
          if rate < gate:
              print(f"FAIL: {rate:.1f}% is below the {gate}% gate.")
              sys.exit(1)
          print("PASS: Coverage gate satisfied.")
          EOF

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results-unit.xml
          retention-days: 14

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Similarity engine regression gate (SIM-147)
  # Runs after unit-tests; detects engine drift between commits.
  # ---------------------------------------------------------------------------
  regression:
    name: Regression gate (similarity engines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run regression suite
        run: |
          pytest tests/regression/ \
            -v \
            --tb=short \
            --timeout=60 \
            --strict-markers \
            --junit-xml=test-results-regression.xml

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: test-results-regression.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 5 — Docker build check
  # Verifies the multi-stage Dockerfile builds to the runtime target without error.
  # Does NOT push. Push is handled by docker-release.yml on main.
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          # GitHub Actions cache — avoids full rebuild on each CI run
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Annotate with commit SHA for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

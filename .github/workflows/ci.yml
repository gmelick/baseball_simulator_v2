# =============================================================================
# MLB Baseball Simulation Platform — CI Pipeline (SIM-146)
#
# Triggers:
#   push    → any branch  (lint + unit-tests + regression + docker-build check)
#   PR      → main        (all jobs required; docker-build check blocks merge)
#
# Job graph:
#   lint ──────────────┐
#   type-check ────────┤──▶ docker-build-check
#   unit-tests ────────┤
#   regression ────────┘   (needs: unit-tests)
#
# Coverage gate: 80% line coverage required on similarity/ + pipeline/
# Regression gate: golden-file snapshot comparison for all 9 similarity engines
# =============================================================================

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

# Cancel in-flight runs for the same ref (save CI minutes on force-pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SIM-431: unified to 3.13 (the version the project now targets — see
  # [tool.ruff] target-version + [tool.mypy] python_version) so lint/test
  # here run the same interpreter as local dev, the weekly + docker workflows.
  PYTHON_VERSION: '3.13'
  # Minimum line-coverage threshold for the measured packages
  # (similarity/ + pipeline/ + simulation/ + betting/ + api/).
  # Scope is configured in pyproject.toml's [tool.coverage.run] section —
  # CLI / diagnostic / real-time streaming files are excluded since they're
  # exercised by regression + integration tests, not unit tests.
  COVERAGE_GATE: 80

# ---------------------------------------------------------------------------
# Job 1 — Lint
# Fast-fail: ruff check + ruff format check in <30s
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        # Pinned to the validated line. The old `>=0.4,<1` floor let a fresh CI
        # install pick up any future ruff, and 0.16 duly changed SCOPE (it began
        # formatting Python inside .md), turning a green lint job red with zero
        # code changes. Same failure class as the FastAPI/Starlette drift — a
        # floor-only spec silently upgrades a tool across a behavior change.
        run: pip install "ruff>=0.15,<0.17"

      - name: Ruff — lint check
        run: ruff check . --output-format=github

      - name: Ruff — format check (no diff)
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2 — Static type checking
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime deps + mypy
        run: |
          pip install -r requirements.txt
          pip install "mypy>=1.8,<2" types-redis types-requests

      - name: Mypy — similarity, pipeline, api
        run: |
          # Config is in pyproject.toml; CLI just selects targets.
          mypy similarity/ pipeline/ api/ --no-error-summary

  # ---------------------------------------------------------------------------
  # Job 3 — Unit tests + coverage gate
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage (fast lane — excludes @slow, SIM-418)
        # SIM-418: the ~15 @pytest.mark.slow volume/exhaustive tests run in the
        # dedicated `slow-tests` job below; this lane stays fast for quick PR
        # feedback. The slow tests are volume variants of modules already
        # covered here, so the coverage gate is unaffected.
        run: |
          pytest tests/unit/ \
            -v \
            -m "not slow" \
            --tb=native \
            --timeout=30 \
            --strict-markers \
            --cov-config=pyproject.toml \
            --cov=similarity \
            --cov=pipeline \
            --cov=simulation \
            --cov=betting \
            --cov=api \
            --cov-report=xml:coverage.xml \
            --junit-xml=test-results-unit.xml

      - name: Enforce coverage gate (${{ env.COVERAGE_GATE }}%)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("coverage.xml")
          rate = float(tree.getroot().get("line-rate", 0)) * 100
          gate = int("${{ env.COVERAGE_GATE }}")
          print(f"Line coverage: {rate:.1f}%  (gate: {gate}%)")
          if rate < gate:
              print(f"FAIL: {rate:.1f}% is below the {gate}% gate.")
              sys.exit(1)
          print("PASS: Coverage gate satisfied.")
          EOF

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results-unit.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3b — Slow tests (SIM-418)
  # The ~15 @pytest.mark.slow volume/exhaustive tests, split out of the fast
  # unit lane so PR feedback stays quick. Runs in parallel (no `needs:`); a
  # higher --timeout accommodates the exhaustive runs (per-test
  # @pytest.mark.timeout overrides still apply, e.g. the 5000-game sim326).
  # No coverage gate — these are volume variants of already-covered modules.
  # ---------------------------------------------------------------------------
  slow-tests:
    name: Slow tests (@slow)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run slow tests
        run: |
          pytest tests/unit/ \
            -v \
            -m "slow" \
            --tb=native \
            --timeout=120 \
            --strict-markers \
            --junit-xml=test-results-slow.xml

      - name: Upload slow test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-results
          path: test-results-slow.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 4 — Similarity engine regression gate (SIM-147)
  # Runs after unit-tests; detects engine drift between commits.
  # ---------------------------------------------------------------------------
  regression:
    name: Regression gate (similarity engines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run regression suite
        run: |
          pytest tests/regression/ \
            -v \
            --tb=native \
            --timeout=60 \
            --strict-markers \
            --junit-xml=test-results-regression.xml

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: test-results-regression.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4d — API E2E + WebSocket suite (SIM-371)
  # FastAPI TestClient end-to-end flows (games/simulate/plays/state/betting +
  # WebSocket + historical-replay reproducibility). No live DB / testcontainers
  # required (uses the no-DB factory + mock seams), so it runs on every push.
  # ---------------------------------------------------------------------------
  e2e:
    name: API E2E + WebSocket suite (SIM-371)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run API E2E suite (TestClient; no live DB)
        run: |
          pytest tests/integration/test_api_e2e_sim371.py \
            -v \
            --tb=native \
            --timeout=120 \
            --strict-markers \
            --junit-xml=test-results-e2e.xml

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results-e2e.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4e — Acceptance band arithmetic (SIM-450)
  #
  # tests/acceptance splits in two. The HEAVY half
  # (test_production_config_bands_sim450.py) needs a 3.2 GB DuckDB, the
  # engine-artifact bundle and Postgres, so it runs only in
  # acceptance-nightly.yml. The band ARITHMETIC half
  # (test_band_arithmetic_sim450.py) needs none of that — 26 tests, pure maths,
  # 0.6 s measured on 2026-08-10. Until this job existed, CI collected neither
  # half, so the rule that decides red-or-green for every box-score channel was
  # itself untested on every push.
  #
  # The comment here used to say "8 tests". The module held 26. That gap was not
  # cosmetic: the post-run guard below trusted the same figure and let 18 tests —
  # including both flagship proofs — be deleted while the lane stayed green.
  # Keep the count and the guard roster true, or the guard drifts back into
  # decoration.
  #
  # No `needs:` on purpose. The band rule is the instrument that catches a
  # broken simulator. It must never be gated behind another job's failure, or a
  # red unit lane silently hides a broken band rule too.
  # ---------------------------------------------------------------------------
  acceptance-arithmetic:
    name: Acceptance band arithmetic (SIM-450)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the band-arithmetic tests (no DB, no artifact bundle)
        # The heavy module in the same package skips itself at collection
        # (SIM_ACCEPTANCE is unset here), so naming the file directly is what
        # keeps this lane cheap and deterministic.
        run: |
          pytest tests/acceptance/test_band_arithmetic_sim450.py \
            -v \
            --tb=native \
            --timeout=60 \
            --strict-markers \
            --junit-xml=test-results-acceptance-arithmetic.xml

      - name: Prove the band tests actually executed
        # pytest exits 0 when every selected test SKIPS. Measured 2026-08-10: a
        # 2-test all-skip run exits 0 and prints "2 skipped". So a green tick
        # from the step above does not by itself prove anything ran.
        #
        # This guard replaced a MIN_EXECUTED count on 2026-08-10, because the
        # count lost to two measured defeats:
        #
        #  1. xfail(run=False) counted as executed. pytest writes
        #     <skipped type="pytest.xfail" message="[NOTRUN] ..."> for it and
        #     never calls the body. Measured: 21 tests whose bodies raise
        #     AssertionError scored "collected=21 executed=21 ... PASS".
        #  2. MIN_EXECUTED was 8 against 26 collected. Measured: deleting BOTH
        #     flagship proofs left 24 executed and the guard still exited 0.
        #
        # The fix for both is a ROSTER, not a threshold. Every test below must be
        # present AND must have actually run. Adding a test needs no edit here.
        # Renaming or deleting one turns this lane red until a human updates the
        # roster on purpose — which is the entire point.
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          REPORT = "test-results-acceptance-arithmetic.xml"

          # The two FLAGSHIP proofs head the roster. They are the reason this
          # lane exists: one proves the R band goes red on the documented
          # run-conversion gap, the other proves home_win_pct never reports PASS
          # for a coin-flip simulator. Never remove them.
          REQUIRED = """
          test_the_R_band_reds_on_the_documented_run_conversion_gap_sim450
          test_home_win_pct_never_passes_a_coin_flip_sim450

          test_every_channel_has_a_reference_sim450
          test_box_channels_and_home_win_pct_partition_the_lane_sim450
          test_a_floor_never_rises_to_meet_a_documented_defect_sim450
          test_the_two_repaired_floors_hold_their_measured_values_sim450
          test_the_R_band_does_not_red_a_healthy_model_sim450
          test_the_R_band_boundary_sits_where_the_floor_says_sim450
          test_home_win_pct_passes_a_correct_model_at_the_required_sample_sim450
          test_a_noise_driven_band_never_reports_a_pass_sim450
          test_every_box_channel_resolves_at_the_documented_nightly_sim450
          test_home_win_pct_costs_more_run_than_the_nightly_gives_sim450
          test_required_sample_sizes_match_the_published_table_sim450
          test_half_width_is_the_larger_of_the_two_terms_sim450
          test_band_tightens_as_the_run_grows_sim450
          test_a_band_can_actually_fail_sim450
          test_a_band_does_not_fail_on_a_correct_model_sim450
          test_a_short_run_reports_unresolved_and_the_nightly_reports_fail_sim450
          test_verdict_covers_every_case_exactly_once_sim450
          test_sample_sd_handles_a_degenerate_sample_sim450
          test_z_pins_the_false_alarm_rate_sim450
          test_balanced_game_order_covers_the_whole_set_sim450
          test_balanced_game_order_keeps_every_prefix_near_the_set_mean_sim450
          test_the_prefix_check_rejects_an_ascending_order_sim450
          test_a_shortened_run_cannot_hide_a_park_shift_in_the_R_band_sim450
          test_conftest_slices_the_balanced_game_order_sim450
          """.split()

          try:
              root = ET.parse(REPORT).getroot()
          except Exception as exc:
              print(f"FAIL: cannot read {REPORT}: {exc!r}")
              sys.exit(1)

          executed = set()
          not_run = {}
          skipped = {}

          for case in root.iter("testcase"):
              name = (case.get("name") or "").split("[", 1)[0]
              mark = case.find("skipped")
              if mark is None:
                  # Passed, failed or errored. pytest called the body either way.
                  executed.add(name)
                  continue
              message = mark.get("message") or ""
              if mark.get("type") == "pytest.xfail":
                  # BOTH xfail forms land here and NEITHER proves a measurement.
                  # `xfail(run=False)` writes "[NOTRUN] ..." and pytest never calls
                  # the body. An IMPERATIVE `pytest.xfail()` call writes the bare
                  # reason and aborts the body wherever it was called - which may be
                  # before a single assertion ran. The XML cannot tell the two apart,
                  # so a REQUIRED channel that xfails counts as not measured. A band
                  # that is genuinely expected to be red must FAIL, not xfail.
                  not_run[name] = message or "imperative pytest.xfail()"
              else:
                  skipped[name] = message

          print(f"executed={len(executed)} not_run={len(not_run)} skipped={len(skipped)}")
          for name in sorted(not_run):
              print(f"  NOT RUN  {name}  {not_run[name]}")
          for name in sorted(skipped):
              print(f"  SKIPPED  {name}  {skipped[name]}")

          # Order matters. `not_run` and `skipped` are checked BEFORE `executed`,
          # because the name key drops the "[param]" suffix: a parametrized test
          # with one passing case and one skipped case lands in BOTH sets. Checking
          # `executed` first let the passing case mask the skipped one, so a
          # required channel could be silently deselected one parameter at a time.
          # Every collected case of a required test must run.
          problems = []
          for name in REQUIRED:
              if name in not_run:
                  problems.append(f"{name}: xfail - pytest did not evaluate its assertions")
              elif name in skipped:
                  problems.append(f"{name}: skipped - {skipped[name]}")
              elif name not in executed:
                  problems.append(f"{name}: absent - deleted, renamed or deselected")

          if problems:
              print(f"FAIL: {len(problems)} required test(s) did not run.")
              for line in problems:
                  print(f"  - {line}")
              print("A test that did not run is not a measured channel.")
              print("Renamed or removed one on purpose? Edit REQUIRED in the same commit.")
              sys.exit(1)

          print(f"PASS: all {len(REQUIRED)} required band-rule tests ran.")
          EOF

      - name: Upload band-arithmetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-arithmetic-results
          path: test-results-acceptance-arithmetic.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 5 — Docker build check
  # Verifies the multi-stage Dockerfile builds to the runtime target without error.
  # Does NOT push. Push is handled by docker-release.yml on main.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Job 4b — Secrets / credential leak check (SIM-153)
  # Greps the working tree for literal secrets and committed .env files.
  # Catches accidental credential leaks before they reach main.
  # Decoupled from lint so a leak fails the build with a clear error.
  # ---------------------------------------------------------------------------
  secrets-check:
    name: Secrets check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed .env files
        run: |
          # SIM-153: .env must NEVER be committed.  .env.example is fine.
          if git ls-files | grep -E '^\.env$|/\.env$|\.env\.local$|\.env\.production$'; then
            echo "::error::SIM-153: a committed .env file was found in the repo. .env must be in .gitignore."
            exit 1
          fi
          echo "OK — no committed .env files."

      - name: Grep for literal credential patterns
        run: |
          # SIM-153: catch obvious literal secrets in source.  Scans all source
          # except this workflow file (it's allowed to mention "secret" in
          # comments referencing GitHub Secrets) and the example template.
          # Exits 1 if any HIGH-confidence pattern is found.
          set +e
          MATCHES=$(grep -nIE \
            -e 'password\s*=\s*["'\''][^"'\'' $][^"'\'']{2,}["'\'']' \
            -e 'api[_-]?key\s*=\s*["'\''][A-Za-z0-9_-]{16,}["'\'']' \
            -e 'secret\s*=\s*["'\''][A-Za-z0-9_-]{16,}["'\'']' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=htmlcov \
            --exclude='*.lock' \
            --exclude='.env.example' \
            --exclude='*.md' \
            -r .)
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::SIM-153: literal credential(s) found in source:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no literal credentials detected."

      - name: Verify .env is in .gitignore
        run: |
          # SIM-153 AC #6: .env must be explicitly listed in .gitignore.
          if ! grep -qE '^\.env$|^\.env\b' .gitignore; then
            echo "::error::SIM-153: .gitignore must explicitly list '.env'."
            exit 1
          fi
          echo "OK — .env is in .gitignore."

  # ---------------------------------------------------------------------------
  # Job 4c — File integrity (SIM-315)
  # Flags .py files corrupted by the Cowork/OneDrive file bridge (NUL bytes or
  # truncated/un-parseable source). Pure stdlib — no deps, runs in seconds.
  # ---------------------------------------------------------------------------
  file-integrity:
    name: File integrity (SIM-315)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run file-integrity guard
        run: python scripts/check_file_integrity.py

  # ---------------------------------------------------------------------------
  # Job JS — Frontend type-check, lint, and build (SIM-379)
  # Runs whenever frontend/ files change.  Uses Node 20 LTS + npm ci.
  # Gates: tsc --noEmit (no type errors), eslint (no lint errors), vite build
  # (production bundle compiles cleanly — catches import/resolution errors that
  # tsc alone misses because Vite resolves paths differently).
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 20 — type-check + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Playwright, cross-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E smoke suite (chromium + firefox + webkit)
        # Specs mock the backend via page.route — no live API/DB needed.
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - unit-tests
      - secrets-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          # GitHub Actions cache — avoids full rebuild on each CI run
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Annotate with commit SHA for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

# =============================================================================
# MLB Baseball Simulation Platform — Docker Release (SIM-146)
#
# Runs ONLY on merge to main or a published GitHub Release.
# Builds the runtime Docker image, pushes it to GitHub Container Registry
# (ghcr.io), and tags it with:
#   - The short commit SHA  (e.g. ghcr.io/org/baseball-simulator:abc1234)
#   - `latest`              (on main branch pushes only)
#   - The semver tag        (e.g. v1.2.3, on published releases only)
#
# Required repository secrets:
#   None — GITHUB_TOKEN is sufficient for ghcr.io pushes.
#
# Prerequisite: CI workflow must pass on the same commit (enforced by branch
# protection rules — see .github/workflows/ci.yml for the required status checks).
# =============================================================================

name: Docker Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Required for ghcr.io push via GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags:
      #   main push  →  :latest + :<short-sha>
      #   release    →  :v1.2.3 + :latest + :<short-sha>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest summary
        run: |
          echo "## Docker Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

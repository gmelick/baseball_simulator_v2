site_name: Baseball Simulator — Technical Reference
site_description: >-
  The code reference for the MLB baseball simulation platform: the architecture, an
  order to review the code in, every source file, and one page per area.
docs_dir: docs/technical
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true

# The pages link to source files outside docs/technical/. Those links work in an
# editor and on GitHub; the site does not serve the files, so it only notes them.
validation:
  links:
    not_found: info

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Code review path: code-review-path.md
  - File index: file-index.md
  - Loop cheat sheet: sim-loop-cheat-sheet.md
  - Area pages:
      - Simulation: simulation.md
      - Similarity engines: similarity.md
      - "Pipeline: the nightly builds": pipeline-batch.md
      - "Pipeline: getting data in": pipeline-ingest.md
      - Database: database.md
      - Betting: betting.md
      - API: api.md
      - Frontend: frontend.md
      - Scripts: scripts.md
      - Tests and CI: tests.md

extra:
  generator: false

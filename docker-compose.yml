# =============================================================================
# MLB Baseball Simulation Platform — Docker Compose
# Local development stack
#
# Usage:
#   make dev          → build + start all services (foreground)
#   make down         → stop + remove containers
#   docker compose up -d          → start detached
#   docker compose logs -f app    → tail app logs
#
# Services:
#   db    — PostgreSQL 15 (port 5432)
#   redis — Redis 7      (port 6379)
#   app   — FastAPI app  (port 8000)
#
# DuckDB is intentionally absent — it runs in-process inside the app container.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-baseball_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baseball_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-baseball_sim}
    ports:
      # Host port is overridable via DB_HOST_PORT in .env so contributors
      # already running PostgreSQL on 5432 can pick a free port (eg 5433).
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is applied via 'make migrate' (alembic upgrade head)
      # NOT via /docker-entrypoint-initdb.d/ — Alembic is the single source of truth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baseball_user} -d ${POSTGRES_DB:-baseball_sim}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - baseball_net

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port is overridable via REDIS_HOST_PORT in .env so contributors
      # already running Redis on 6379 (Memurai/WSL/another project) can pick
      # a free port without editing this file.  The app container always
      # reaches Redis at the in-network address ``redis:6379`` regardless.
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - baseball_net

  # ---------------------------------------------------------------------------
  # FastAPI application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ``dev`` extends ``runtime`` with pytest / ruff / mypy / testcontainers
      # so make test, make lint, make format, make type-check work without
      # bind-mounting host Python.  Production deployments override this to
      # ``target: runtime`` for a leaner image.
      target: dev
    restart: unless-stopped
    # SIM-403b publishes ~166 MB of engine-artifact arrays into
    # multiprocessing.shared_memory (backed by /dev/shm); Docker's default
    # /dev/shm is only 64 MB, which overflows ("No space left on device") and
    # wedges the SIM-402 pre-warm. Give the app a roomy shared-memory segment.
    shm_size: "1gb"
    # SIM-430: hard cgroup memory cap so the app + its ProcessPool workers can
    # NEVER pressure the host (a runaway is OOM-killed in THIS container only,
    # protecting other tenants/Docker). Measured 2026-09-15 on the 4-season
    # bundle: the serving parent holds ~6.7 GB private, each forkserver worker
    # ~575 MB private + one 400 MB shared segment. 16g fits 10 workers with
    # ~2.5 GB spare; 14 workers overran 14g and swapped 7.6 GB (n=100 read
    # 55-86 s). The WSL VM is 20 GB (.wslconfig); raise it before this.
    mem_limit: "16g"
    env_file:
      - .env
    environment:
      # In-container DSN is deterministic (the `db` service is always at
      # db:5432), so set it here rather than relying on .env — .env's
      # BASEBALL_DB_DSN is the HOST-side value (localhost:<DB_HOST_PORT>) for
      # host tools and won't resolve inside the network. This override wins over
      # env_file. alembic auto-coerces to the +psycopg2 driver in env.py.
      BASEBALL_DB_DSN: postgresql://baseball_user:baseball_pass@db:5432/baseball_sim
      REDIS_URL:       redis://redis:6379/0
      ENVIRONMENT:     ${ENVIRONMENT:-development}
      # SIM-402 pre-warm: how many workers warm their full-pool cache at once
      # (default 2). At 14 workers (2026-09-15, the WSL cap raised to 16 vCPU /
      # 20 GB) waves of 2 mean 7 waves; 4 keeps the warm inside its 120 s deadline.
      SIM_PREWARM_MAX_CONCURRENT: "4"
      # 2026-09-15: numpy's OpenBLAS defaults to 16 threads PER PROCESS, so ten
      # sim workers spun ~160 BLAS threads on 16 vCPUs (the app read ~1,500%
      # CPU for 10 single-threaded games). One BLAS thread per worker; the
      # games are independent processes and need no intra-process threads.
      OPENBLAS_NUM_THREADS: "1"
      # SIM-434: the manager GATE. ON = the manager hooks run: the pitching
      # change (the draw, SIM_MANAGER_DRAW below; the SIM-434 pull formula was
      # deleted at the SIM-427 flip of 2026-09-13, so with the draw off no
      # pitcher is ever changed), the intentional-walk draw and the steal
      # weight, which read each side's REAL manager profile off the game state.
      # Unit tests pin it OFF (tests/conftest.py). =0 reverts.
      SIM_MANAGER:     "1"
      # SIM-413: L/R platoon batted-ball draw reweight by pitcher hand.
      # Unit tests pin it OFF (tests/conftest.py). Set to 0 to revert.
      SIM_BB_PLATOON:  "1"
      # SIM-476 (2026-08-30): the FITTED SIM-491 draw-weight kernels. The old
      # SIM_PARK_FACTOR / SIM_FIELDER_RBF post-draw flips are DELETED — the
      # park and the live defender now shape the DRAW. Sigmas fitted against
      # the pool's own conditional frequencies (12x200 arms, seed-split
      # confirmed; docs/audit/2026-08-28-sim476-fit-plan.md). 0 disables.
      SIM_PARK_KERNEL_SIGMA:    "0.02"
      # SIM-476 owner ruling 2026-08-30: w=0 — the batted-ball draw
      # hard-conditions on the batting side, delivering the pool's own
      # home/away differential (+0.107 R/g, the MLB size). Replaces the
      # deleted SIM-412 flip. 1.0 disables.
      SIM_HOME_OFF_WEIGHT:      "0.0"
      # SIM-517 (2026-09-04): the catcher RECEIVING kernel (anisotropic —
      # framing dims and blocking dims each fitted on their own ladder
      # against the pool's per-tier conditionals) + the drawn pitch row's
      # got-away resolution (wild pitch / passed ball / uncaught strike-3).
      # The SIM-428 framing flip is DELETED. 0 / 0 / 0 disables.
      # OWNER GO 2026-09-08 (the play-picker redesign): the receiving KERNEL is OFF —
      # it read the catcher's staff, not his skill (SIM-523; the ratio factor that
      # replaces it is SIM-526). The got-away resolution stays ON (it owns none of
      # the reds). Lane 2 (12x500) certified this configuration with the cell index.
      # SIM-523 part E (2026-09-09): the catcher receiving RATIO on taken
      # pitches (the SIM-517 bell-curve kernel and its two sigmas are
      # deleted). OFF; fitting and enabling is SIM-526.
      SIM_CATCHER_RECEIVING:     "0"
      SIM_GOT_AWAY:              "1"
      # SIM-518 (2026-09-07; re-scoped 2026-09-12 by owner ruling): the
      # pitcher-fatigue weight on the PITCH draw — a Gaussian on |live - row|
      # pitch count times one on |live - row| times through the order.
      # LANDED 2026-09-14 by owner decision: the times-through term at
      # bandwidth 0.5, the pitch-count term OFF (it imports "pitchers allowed
      # to pitch deep throw fewer balls"). The evidence on record: the fit on
      # the pool's own within-pitcher effect (docs/audit/2026-09-12-sim518-fit-plan.md
      # §5), the probe re-run on the flipped composition (§5.3 — the ball
      # channel short of the rule) and the two paired accuracy arms on 250
      # games of 2024 (§6 — flat on every market at 0.5 and 0.7; the
      # recommendation was HOLD OFF; the owner chose 0.5). 0 = off.
      SIM_FATIGUE_PC_SIGMA:      "0"
      SIM_FATIGUE_TTO_SIGMA:     "0.5"
      # The pitch draw's situation bandwidth (the Gaussian on the base-out
      # situation). 2.0 = today's code default; SIM-548 ladders it.
      SIM_SIT_SIGMA:             "2.0"
      # The batting side on the pitch draw: LIVE as a HARD FILTER — the side
      # is one of the cell index's five dimensions (2,880 cells since the
      # SIM-469 rebuild), so every level-0 draw already matches it. This soft
      # weight would act only in a widened cell, where re-imposing the side
      # would re-starve it. Stays 1.0 (off) by owner ruling 2026-09-12.
      SIM_PITCH_HOME_OFF_WEIGHT: "1.0"
      # The drawn pitch's similarity on the batted-ball draw: SUPERSEDED by
      # the born batted ball (SIM-523 part B/C) — the pitch reaches the
      # fielding draw through the ball it produced. Stays 0 (off) by owner
      # ruling 2026-09-12; the code and its tests stay.
      SIM_BB_PITCH_SIGMA:        "0"
      # SIM-467 (2026-09-07): the pitch-draw CELL INDEX — each plate appearance
      # draws from its (runners, outs, score band, side) cell instead of the
      # whole pool (decision #19's widening ladder below SIM_PITCH_MIN_CELL
      # rows). OFF until the 12x500 lane certifies it; the certification commit
      # flips it to 1 (docs/audit/2026-09-04-sim467-518-plan.md §5.4).
      # OWNER GO 2026-09-08: ON — lane 2 (12x500, receiving kernel OFF) passed every
      # band but strikeouts (-2.1% vs a 2.0% floor, a fit residual). 3x per iteration.
      SIM_PITCH_CELL_INDEX:      "1"
      SIM_PITCH_MIN_CELL:        "20"
      # SIM-523 part A (2026-09-08): the actor SCORE MATRICES — each actor
      # factor becomes its engine's composite score, looked up from the nightly
      # matrix and raised to a fitted power (SIM_ACTOR_POWER_<name>). OFF until
      # part F fits the powers and the lane certifies them.
      SIM_ACTOR_POWER_BATTER:    "1.0"
      SIM_ACTOR_POWER_FIELDER:   "1.2"
      SIM_ACTOR_POWER_RUNNER_STEAL: "12"
      SIM_ACTOR_POWER_RUNNER_ADV: "20"
      SIM_ACTOR_POWER_CATCHER_THROWING: "2"
      SIM_ACTOR_POWER_PITCHER_STEAL: "12"
      # SIM-523 part B (2026-09-08): the PITCH / PITCH-RESULT split — the
      # pitch draw picks the pitch thrown, the result draw picks what happens
      # to it (conditioned on the pitch through the pitch engine's metric;
      # the in-play result carries its own batted ball). Fitted 2026-09-09
      # (pitcher 16 in both draws, batter 8 in the result draw); held OFF
      # because the balanced lane read strikeouts per plate appearance −2.4%
      # (SIM-527). FLIPPED ON 2026-09-14 by owner decision on the accuracy
      # comparison (SIM-548 Part A4, 250 games of 2024): the starter strikeout
      # market −0.0155 Brier [−0.0258, −0.0050] — the gap to the closing line
      # halved; the moneyline −0.0050; the batter props flat; the first-five
      # total +0.0113 at two standard errors against an outlier baseline row.
      # The 2025 hold-out has NOT run. The strikeout probabilities sit 6.5
      # points low with the split on (the SIM-527 shortfall as a bias) — the
      # calibration layer's first job (the SIM-548 joint-fit plan, §7).
      SIM_PITCH_RESULT_SPLIT:    "1"
      SIM_PITCH_PITCHER_POWER:   "16"
      SIM_RESULT_PITCHER_POWER:  "16"
      SIM_RESULT_BATTER_POWER:   "8"
      # SIM-523 part F: the runner kernels' bandwidths in the steal and the
      # advancement draws (empty = the shared sigma 1.0).
      # The born batted ball's kernel on the fielding draw (0 = off).
      SIM_BB_BORN_SIGMA:         "1.0"
      # SIM-523 part C (2026-09-08): the fielding draw's batted-ball CLASS
      # filter, the batter sprint-speed kernel and the park wall-zone rule.
      # OFF until part F fits them and a lane certifies.
      SIM_BB_CLASS_FILTER:       "1"
      # SIM-523 (the kernel retirement): the fielding draw's batter factor is
      # the batter engine's score raised to this power (with the matrices on).
      SIM_BB_BATTER_POWER:       "4"
      SIM_PARK_WALL_ZONE_ONLY:   "1"
      SIM_WALL_ZONE_DISTANCE:    "300"
      # The fence stage (the born ball against the live park's fence) and its
      # band in feet (0 = decisive; the probe measured a 10-foot band losing
      # ~30% of home runs). OFF until part F and a lane.
      SIM_FENCE_STAGE:           "1"
      SIM_FENCE_MARGIN:          "0"
      # SIM-523 part D (2026-09-08): the pitching change as a DRAW from the
      # opportunity pool (the pool's own change rate for the boundary's cell,
      # the live manager's usage similarity a weight). FLIPPED ON 2026-09-13
      # (SIM-427, the plan's §5 conditions met: the usage numbers sit on the
      # box score's — 4.45 pitchers per team-game vs 4.28, starter pitches
      # 84.6 ± 19.2 vs 84.7 ± 17.4 — and the paired accuracy run on 250 games
      # of 2024 read the draw MORE accurate on the starter strikeout market
      # (Brier −0.0156, CI [−0.0255, −0.0066]) and the moneyline (−0.0062), flat
      # elsewhere). OFF = no pitching change (the pull formula is deleted).
      SIM_MANAGER_DRAW:          "1"
      # SIM-427: the live manager's usage-similarity weight on the change
      # draw (the manager engine's 0-1 score at this power; 0 = off) and the
      # reliever draw's weights — the entering arm's resemblance to the arm
      # the drawn row brought in: role (high-leverage entry share, a Gaussian
      # bandwidth), stuff (the pitcher engine's score at a power), rest (days,
      # a bandwidth), pitched in the last two days (a mismatch weight; 1.0 =
      # off), pitches over the last three days (a bandwidth) and hand (a
      # mismatch weight; 1.0 = off). FITTED and FLIPPED 2026-09-13 (the plan's
      # 4f stamp): manager power 4, role 0.1, rest 0.5, pitched-in-2-days
      # 0.25, pitches-in-3-days 10; hand and stuff stay off (no read needed them).
      SIM_ACTOR_POWER_MANAGER_USAGE: "4"
      # SIM-427: where the pen comes from. "box" = the MLB box's per-game
      # listing (raw.game_bullpen, minus the rotation and today's starter,
      # with each arm's rest and recent usage; production since the flip);
      # "synthetic" = the invented six-arm pen (the no-DB seam, and the
      # fallback for a game with no listing — logged).
      SIM_BULLPEN_SOURCE:            "box"
      SIM_RELIEF_ROLE_SIGMA:         "0.1"
      SIM_RELIEF_PITCHER_POWER:      "0"
      SIM_RELIEF_REST_SIGMA:         "0.5"
      SIM_RELIEF_PITCHED2D_OFF_WEIGHT: "0.25"
      SIM_RELIEF_PITCHES3D_SIGMA:    "10"
      SIM_RELIEF_HAND_OFF_WEIGHT:    "1.0"
      # SIM-453: WHERE the park factors come from. The park consumer above was on,
      # but the factors were dark: api/routes/games.py read them through
      # app.state.sim_duckdb, and api/main.py only opened that connection under
      # REPLAY_PERSISTENCE_ENABLED — a variable set in NEITHER .env NOR this file
      # (only in .env.production.example and .env.staging.example). So the nudge had
      # a neutral 1.0 to act on for every venue, and the resolver reported it as
      # "resolved". derived.park_factors held 2,952 rows the whole time (35 for 2024
      # factor_type='R', from 0.8724 to 1.1339).
      #
      # We did NOT fix that by setting REPLAY_PERSISTENCE_ENABLED here. That flag
      # opens a WRITABLE DuckDB connection, and the file has no sim.play_stream /
      # sim.state_snapshots tables, so the replay routes would 500 instead of 503.
      # api/main.py now opens the park-factor source READ-ONLY as its own concern.
      # This line just makes the path explicit instead of an implicit code default,
      # so the compose file names the source the simulator reads.
      #
      # REPLAY_PERSISTENCE_ENABLED stays UNSET on purpose. It is a write path and is
      # no longer the gate on park factors.
      BASEBALL_DUCKDB_PATH: /data/baseball_sim.duckdb
      # SIM-406: the fitted CalibrationReport the lifespan loads to calibrate every
      # similarity engine + the win-prob map. Produced by `make calibrate` /
      # scripts/fit_calibration.py (and the nightly chain) into the /data volume.
      # Missing file -> engines keep locked defaults + identity win-prob (no boot
      # failure), so this is safe before the first fit has run.
      CALIBRATION_REPORT_PATH: /data/calibration.json
    ports:
      # Host port is overridable via APP_HOST_PORT (default 8000).
      - "${APP_HOST_PORT:-8000}:8000"
    volumes:
      # Mount source for hot-reload in development
      # Comment out for a production-like build test
      - ./api:/app/api
      - ./pipeline:/app/pipeline
      - ./similarity:/app/similarity
      # SIM-375: mount the real Phase-5 simulation package (not the dead
      # ``simulator`` stub) so the Monte-Carlo loop/runner code hot-reloads in dev.
      - ./simulation:/app/simulation
      - ./db:/app/db
      # Persistent /data volume so the DuckDB file produced by
      # pipeline/batch/player_profile_computor.py survives container
      # restarts and is visible to both the `app` service and any
      # one-off `docker compose run --rm app ...` invocations.
      - duckdb_data:/data
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # SIM-402: startup now builds the 11 engines AND pre-warms the worker pool
      # (bounded, but can legitimately take a minute+ on a cold box). A generous
      # start_period lets a slow-but-healthy warm finish without racking up
      # unhealthy strikes; a successful /health still flips the container healthy
      # immediately once the app yields.
      start_period: 180s
    networks:
      - baseball_net

  # ---------------------------------------------------------------------------
  # nginx reverse proxy (SIM-373)
  # Fronts the ``app`` service: proxies REST/ops/docs to app:8000 and the
  # live-game WebSocket (/ws/games/{game_pk}) with the HTTP/1.1 Upgrade
  # handshake. Publishes :80 on the host (443 stub left commented).
  # Config: deploy/nginx/nginx.conf (mounted read-only).
  # ---------------------------------------------------------------------------
  nginx:
    # SIM-401: build the frontend image (Vite build → nginx serving the SPA +
    # the SIM-381 reverse-proxy/SPA-fallback config, both baked in).
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      # Host port overridable via NGINX_HTTP_PORT (default 80).
      - "${NGINX_HTTP_PORT:-80}:80"
      # TLS — uncomment together with the :443 server block + cert mount in
      # deploy/nginx/nginx.conf for staging/prod.
      # - "${NGINX_HTTPS_PORT:-443}:443"
    # nginx.conf + the built SPA are baked into the image (SIM-401); mount TLS
    # certs here when enabling the :443 server block:
    # volumes:
    #   - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Static-root liveness (doesn't couple nginx readiness to the backend).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - baseball_net

  # ---------------------------------------------------------------------------
  # Migration runner (one-shot service)
  # Run via: docker compose run --rm migrate
  # Or:      make migrate
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    # No environment: override here.  BASEBALL_DB_DSN comes straight from .env
    # and alembic env.py auto-coerces postgresql:// to postgresql+psycopg2://
    # (see db/migrations/env.py).  This avoids the docker-compose ${VAR:-default}
    # substitution path that broke on some Windows / Compose v2 combinations.
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baseball_net
    profiles:
      - tools     # only runs when explicitly invoked: make migrate

  # ---------------------------------------------------------------------------
  # Prometheus (SIM-374)
  # Scrapes the app's /metrics endpoint (api/routes/metrics.py) per
  # deploy/monitoring/prometheus.yml and stores the series in prometheus_data.
  # Grafana (below) reads from it. Publishes :9090 on the host (overridable).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      # Host port overridable via PROMETHEUS_HOST_PORT (default 9090).
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - baseball_net

  # ---------------------------------------------------------------------------
  # Grafana (SIM-374)
  # Auto-provisions the Prometheus datasource + the SIM-374 dashboard from
  # deploy/monitoring/grafana/ and persists its state in grafana_data.
  # Publishes :3000 on the host (overridable). depends_on prometheus.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Disabled sign-up; default org dashboards come from provisioning.
      GF_USERS_ALLOW_SIGN_UP:     "false"
    ports:
      # Host port overridable via GRAFANA_HOST_PORT (default 3000).
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      # Provisioning: datasource + dashboard provider configs.
      - ./deploy/monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./deploy/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # The dashboard JSON the provider above loads.
      - ./deploy/monitoring/grafana:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - baseball_net

  # Nightly data-ingestion scheduler (Ofelia, docker-native cron). Opt-in via
  # the `scheduler` profile so it never starts on a plain `make dev`:
  #   docker compose --profile scheduler up -d scheduler
  # Runs scripts/nightly_ingest.sh (refresh current-season games → profiles →
  # FAISS tiles) as a fresh app-image container at 07:00 UTC; see
  # deploy/ofelia/config.ini. Requires the app image to be built first
  # (docker compose build app) so the script is present.
  scheduler:
    image: mcuadros/ofelia:latest
    profiles: ["scheduler"]
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Read-only docker socket so Ofelia can launch the nightly job container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/ofelia/config.ini:/etc/ofelia/config.ini:ro
    networks:
      - baseball_net

# ---------------------------------------------------------------------------
# Volumes — persist data across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  duckdb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  baseball_net:
    driver: bridge

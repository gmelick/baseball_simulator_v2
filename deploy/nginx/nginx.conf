# =============================================================================
# MLB Baseball Simulation Platform — nginx reverse proxy
# SIM-373 (Phase 5)
#
# Sits in front of the FastAPI ``app`` service (uvicorn on :8000, in-network
# hostname ``app``). Terminates client connections on :80 (TLS stub on :443),
# proxies REST + ops + docs to the app, and proxies the live-game WebSocket
# (/ws/games/{game_pk}) with the HTTP/1.1 Upgrade handshake.
#
# Mounted read-only into the nginx:1.27-alpine container at
# /etc/nginx/nginx.conf (see docker-compose.yml ``nginx`` service).
#
# Validate (where the nginx binary is available):
#   docker compose run --rm --no-deps nginx nginx -t
# or:
#   nginx -t -c /path/to/deploy/nginx/nginx.conf
# =============================================================================

# Auto-detect CPU count for worker processes.
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # -------------------------------------------------------------------------
    # Core / logging
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;          # do not leak the nginx version in headers

    # Largest accepted request body. /simulate + override payloads are small
    # JSON, but allow headroom for batched line-up / config posts.
    client_max_body_size  10m;

    # -------------------------------------------------------------------------
    # gzip — compress JSON / text responses (sim payloads, box scores, etc.)
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        application/json
                      application/javascript
                      application/xml
                      text/css
                      text/plain
                      text/xml;

    # -------------------------------------------------------------------------
    # Upstream — the FastAPI app container.
    # Internal port confirmed from Dockerfile (EXPOSE 8000 / uvicorn --port
    # 8000) and docker-compose ``app`` service (8000:8000).
    # -------------------------------------------------------------------------
    upstream baseball_app {
        # ``app`` resolves on the compose ``baseball_net`` bridge network.
        server app:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Map the Upgrade request header into a Connection value so non-WS
    # requests get ``Connection: ""`` (keep-alive friendly) and WS requests
    # get ``Connection: upgrade``. Recommended nginx pattern for WebSockets.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared proxy headers (DRY across the location blocks below).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # HTTP server (:80). In staging/prod, terminate TLS here or at an
    # upstream LB; the 443 stub below shows where the certs would mount.
    # -------------------------------------------------------------------------
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # ---------------------------------------------------------------------
        # WebSocket — live game subscriptions: /ws/games/{game_pk}
        # MUST use HTTP/1.1 + the Upgrade/Connection headers or the handshake
        # 426/400s. Long read timeout so idle live-game sockets aren't culled
        # mid-game; disable proxy buffering so frames flush immediately.
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection $connection_upgrade;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering         off;
            proxy_read_timeout      3600s;   # keep idle live sockets open ~1h
            proxy_send_timeout      3600s;
        }

        # ---------------------------------------------------------------------
        # REST API + ops + docs. /simulate can take several seconds for a
        # large Monte-Carlo batch, so the read timeout is generous (but far
        # below the WS one). Buffering on for normal request/response JSON.
        # Matches: /api/*, /health, /ready, /docs, /openapi.json, and / .
        # ---------------------------------------------------------------------
        location / {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";     # enable upstream keep-alive
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_connect_timeout   5s;
            proxy_read_timeout      120s;    # headroom for multi-second /simulate
            proxy_send_timeout      120s;
        }

        # Lightweight health endpoint for upstream LB / uptime checks that
        # should not pay the proxy buffering / keep-alive overhead.
        location = /health {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            access_log              off;
        }
    }

    # -------------------------------------------------------------------------
    # TLS server (:443) — STUB. Enable in staging/prod by publishing 443 in
    # docker-compose and mounting real certs (e.g. via certbot / a secret).
    # Left commented so the dev stack runs cleanly without certificates.
    # -------------------------------------------------------------------------
    # server {
    #     listen      443 ssl;
    #     listen      [::]:443 ssl;
    #     server_name your-domain.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # Re-use the same location blocks as the :80 server above.
    #     location /ws/ { ... }
    #     location /    { ... }
    # }
}

# =============================================================================
# MLB Baseball Simulation Platform — nginx reverse proxy
# SIM-373 (Phase 5) + SIM-381 (Phase 6 frontend serving)
#
# Sits in front of the FastAPI ``app`` service (uvicorn on :8000, in-network
# hostname ``app``). Terminates client connections on :80 (TLS stub on :443).
#
# Traffic routing:
#   /ws/*            → WebSocket proxy to FastAPI (live game subscriptions)
#   /api/*           → REST proxy to FastAPI
#   /health /ready   → proxy to FastAPI (ops probes)
#   /docs /redoc /openapi.json /metrics → proxy to FastAPI
#   /assets/*        → static files, immutable 1-year cache (Vite hashed names)
#   /                → SPA catch-all: try_files → index.html (React Router)
#
# Static files location: /var/www/baseball-sim (mounted from frontend/dist/).
# See docker-compose.yml nginx service for the volume mount.
#
# Mounted read-only into the nginx:1.27-alpine container at
# /etc/nginx/nginx.conf (see docker-compose.yml ``nginx`` service).
#
# Validate (where the nginx binary is available):
#   docker compose run --rm --no-deps nginx nginx -t
# or:
#   nginx -t -c /path/to/deploy/nginx/nginx.conf
# =============================================================================

# Auto-detect CPU count for worker processes.
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # -------------------------------------------------------------------------
    # Core / logging
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;          # do not leak the nginx version in headers

    # Largest accepted request body. /simulate + override payloads are small
    # JSON, but allow headroom for batched line-up / config posts.
    client_max_body_size  10m;

    # -------------------------------------------------------------------------
    # gzip — compress JSON / text responses (sim payloads, box scores, etc.)
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        application/json
                      application/javascript
                      application/xml
                      text/css
                      text/plain
                      text/xml;

    # -------------------------------------------------------------------------
    # Upstream — the FastAPI app container.
    # Internal port confirmed from Dockerfile (EXPOSE 8000 / uvicorn --port
    # 8000) and docker-compose ``app`` service (8000:8000).
    # -------------------------------------------------------------------------
    upstream baseball_app {
        # ``app`` resolves on the compose ``baseball_net`` bridge network.
        server app:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Map the Upgrade request header into a Connection value so non-WS
    # requests get ``Connection: ""`` (keep-alive friendly) and WS requests
    # get ``Connection: upgrade``. Recommended nginx pattern for WebSockets.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared proxy headers (DRY across the location blocks below).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # HTTP server (:80). In staging/prod, terminate TLS here or at an
    # upstream LB; the 443 stub below shows where the certs would mount.
    # -------------------------------------------------------------------------
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # Root for static frontend files (Vite build output).
        # docker-compose mounts frontend/dist → /var/www/baseball-sim in the
        # nginx container (read-only). In a multi-stage Docker build the dist
        # directory is COPY'd into this path at image build time.
        root /var/www/baseball-sim;

        # ---------------------------------------------------------------------
        # WebSocket — live game subscriptions: /ws/games/{game_pk}
        # MUST use HTTP/1.1 + the Upgrade/Connection headers or the handshake
        # 426/400s. Long read timeout so idle live-game sockets aren't culled
        # mid-game; disable proxy buffering so frames flush immediately.
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection $connection_upgrade;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering         off;
            proxy_read_timeout      3600s;   # keep idle live sockets open ~1h
            proxy_send_timeout      3600s;
        }

        # ---------------------------------------------------------------------
        # SIM-389: Auth endpoints — /auth/* → FastAPI (login / me / logout).
        # Separated from /api/ so the browser can POST /auth/login without
        # an /api prefix and receive the Set-Cookie response correctly.
        # ---------------------------------------------------------------------
        location /auth/ {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_connect_timeout   5s;
            proxy_read_timeout      10s;
            proxy_send_timeout      10s;
        }

        # ---------------------------------------------------------------------
        # REST API — /api/* → FastAPI
        # /simulate can take several seconds for a large Monte-Carlo batch, so
        # the read timeout is generous.  Buffering on for normal JSON responses.
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";     # enable upstream keep-alive
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_connect_timeout   5s;
            proxy_read_timeout      120s;    # headroom for multi-second /simulate
            proxy_send_timeout      120s;
        }

        # ---------------------------------------------------------------------
        # Ops / docs endpoints — proxy to FastAPI.
        # Explicit locations so these never fall through to the SPA catch-all.
        # ---------------------------------------------------------------------
        location = /health {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            access_log              off;
        }

        location = /ready {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            access_log              off;
        }

        location = /metrics {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
        }

        location /docs {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host $host;
        }

        location /redoc {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host $host;
        }

        location = /openapi.json {
            proxy_pass              http://baseball_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host $host;
        }

        # ---------------------------------------------------------------------
        # SIM-381: Static assets (Vite-hashed filenames).
        # Vite outputs /assets/main-<hash>.js, /assets/main-<hash>.css, etc.
        # Hashed names are content-addressed → safe for immutable 1-year cache.
        # No fallback needed here — a 404 for a missing asset is correct.
        # ---------------------------------------------------------------------
        location /assets/ {
            expires        1y;
            add_header     Cache-Control "public, immutable";
            access_log     off;
            # Root is inherited from the server block (/var/www/baseball-sim).
        }

        # Favicon, manifest.json, robots.txt, etc. — short cache.
        location ~* \.(ico|webmanifest|txt|xml|svg|png)$ {
            expires        30d;
            add_header     Cache-Control "public";
            access_log     off;
            try_files      $uri =404;
        }

        # ---------------------------------------------------------------------
        # SIM-381: SPA catch-all — all non-API, non-static routes serve
        # index.html so React Router can handle client-side navigation.
        #
        # try_files: look for the exact file, then fall back to index.html.
        # index.html itself is served with no-cache so deploys take effect
        # immediately (the hashed /assets/* get the 1-year browser cache).
        # ---------------------------------------------------------------------
        location / {
            try_files $uri /index.html;

            # No-cache for the SPA entry point so the browser always fetches
            # the latest index.html after a deploy (new asset hashes inside).
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma        "no-cache";
                expires    0;
            }
        }
    }

    # -------------------------------------------------------------------------
    # TLS server (:443) — STUB. Enable in staging/prod by publishing 443 in
    # docker-compose and mounting real certs (e.g. via certbot / a secret).
    # Left commented so the dev stack runs cleanly without certificates.
    # -------------------------------------------------------------------------
    # server {
    #     listen      443 ssl;
    #     listen      [::]:443 ssl;
    #     server_name your-domain.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # Re-use the same location blocks as the :80 server above.
    #     location /ws/    { ... }
    #     location /api/   { ... }
    #     location /health { ... }
    #     location /assets/{ ... }
    #     location /       { try_files $uri /index.html; }
    # }
}

; =============================================================================
; Ofelia scheduler config — nightly data ingestion (docker-native cron).
;
; Used by the docker-compose `scheduler` service (profile: scheduler). Ofelia
; runs each job as a FRESH container off the app image so the heavy batch never
; competes with the live API container.
;
; Schedule format is 6-field cron (sec min hour dom mon dow), UTC. The whole
; refresh→profiles→engine-artifacts chain runs sequentially inside
; nightly_ingest.sh.
;
; The image / network / volume names are the docker-compose defaults derived
; from the project directory name (baseball_simulator_v2). If you rename the
; project dir or set COMPOSE_PROJECT_NAME, update these three lines.
; =============================================================================

[job-run "nightly-ingest"]
schedule = 0 0 7 * * *
image = baseball_simulator_v2-app
network = baseball_simulator_v2_baseball_net
volume = baseball_simulator_v2_duckdb_data:/data
environment = BASEBALL_DB_DSN=postgresql://baseball_user:baseball_pass@db:5432/baseball_sim
environment = BASEBALL_DUCKDB_PATH=/data/baseball_sim.duckdb
command = sh /app/scripts/nightly_ingest.sh

; SIM-546: the nightly closing pass. The live pipeline promotes each game's
; closing rows at first pitch; this job runs the historical loader's closing
; pass over yesterday's and the day before's games as the fallback and the
; reconciliation (scripts/nightly_closing_lines.sh). It is its own job, after
; the ingest chain, so a vendor outage never stops the profile and artifact
; rebuild.
;
; It runs INSIDE the running app container (job-exec), not as a fresh one: the
; app service reads the host's .env (env_file), the place for the vendor key
; ODDS_API_KEY. A fresh job-run container reads no .env, so the script would
; exit 1 every night. The key never sits in this file. The command sets
; ODDS_PROVIDER for this one process only: the script runs only on the
; BettingPros provider (the mock must never write closing rows into the real
; store), and the app container does not set it. The container name is the
; docker-compose default (project baseball_simulator_v2, service app, index 1).
;
; Run book: after `docker compose build app` and `docker compose up -d app`
; (the script is baked into the image), check the key is set without printing
; it: docker compose exec app sh -c 'test -n "$ODDS_API_KEY" && echo set'
; Then run the job once by hand and confirm it writes rows:
;   docker compose exec app env ODDS_PROVIDER=bettingpros sh /app/scripts/nightly_closing_lines.sh
[job-exec "nightly-closing-lines"]
schedule = 0 30 9 * * *
container = baseball_simulator_v2-app-1
command = env ODDS_PROVIDER=bettingpros sh /app/scripts/nightly_closing_lines.sh

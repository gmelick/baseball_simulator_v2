; =============================================================================
; Ofelia scheduler config — the nightly and weekly data jobs (docker-native cron).
;
; Used by the docker-compose `scheduler` service, which starts with the stack
; since SIM-519 (decision D6: the data drifted for 16 days while the job was
; opt-in).
;
; SIM-443b (2026-10-13): the three data jobs are job-exec jobs into the
; compose `jobs` container. Before, Ofelia started a FRESH container off the
; app image for each one, and that container got its DSN from an environment
; line here, the database password included.
; Ofelia's INI does not expand environment variables, so a fresh container
; can get a credential only as a literal in this file. No credential may sit
; here. The `jobs` container gets the composed app-role DSN, and .env, from
; docker-compose.yml, and a job exec'd into it inherits that environment.
; The `jobs` container idles between jobs, so the batch never competes with
; the live API container.
;
; Schedule format is 6-field cron (sec min hour dom mon dow), UTC.
;
; The container names are the docker-compose defaults derived from the
; project directory name (baseball_simulator_v2): project, service, index 1.
; A worktree's stack or a COMPOSE_PROJECT_NAME names them after itself:
; update the `container =` lines there.
;
; What changed with the move: the jobs share one container, so on Sunday at
; 08:00 the season sweep and the rebuild share one memory cap (JOBS_MEM_LIMIT
; in .env). A stopped `jobs` container fails its five jobs, the data backup
; and the off-site copy (SIM-568) included; Ofelia logs the exec error. The
; marks (scripts/with_mark.sh) land on the same /data volume.
;
; The marks: the finals load, the Sunday sweep, the profile + bundle rebuild,
; the data backup and the off-site copy each run inside scripts/with_mark.sh.
; While a job runs, /data/ingest_marks/<name>.running holds its start time;
; at its end, <name>.last holds its exit. The rebuild waits on the finals
; marks; the data backup waits on the rebuild's, finals' and sweep's marks;
; the off-site copy waits on the data backup's mark.
;
; The backup window (SIM-525, the scheduled backups of the three data stores):
; 10:00 UTC, after the rebuild ends (about 09:30) and before the closing pass
; (10:30). The Postgres dump runs in the db container; the DuckDB file and the
; bundle copy run in the jobs container. Each backup job sets no-overlap, so a
; slow run never starts twice. The sets land in BACKUP_DIR on the host
; (docker-compose.yml mounts it at /backups).
;
; The off-site copy (SIM-568): 10:30 UTC, in the jobs container. It copies the
; newest complete sets of each store from /backups to /offsite, the host folder
; OFFSITE_BACKUP_DIR (a OneDrive folder; the OneDrive client uploads it). Ofelia
; has no job dependencies, so the copy starts at a fixed time and waits: while
; the data backup's nightly-backup.running mark is fresh, or the Postgres job's
; /backups/postgres/.lock holds a recent start, it polls once a minute. After
; two hours it logs the wait and copies the complete sets it finds. The copy
; then takes about 10 to 25 minutes, so it can still run after 10:45.
; Recreate the jobs container only when no /data/ingest_marks/*.running mark
; exists, nightly-backup-offsite.running included. The 10:30 closing pass
; runs in the app container, so the two never share a container.
; =============================================================================

; SIM-519 Part D: the last three days' final games (Postgres only, safe while
; the app runs), wrapped so a segfault (the SIM-445 crash class) reruns it.
; 07:00 UTC = 3 am Eastern, after the last West Coast final.
; SIM-563 follow-up (2026-10-11): with_mark.sh leaves a running mark and the
; last exit on the /data volume; the nightly rebuild waits on them
; (scripts/wait_for_ingest.sh), so it never reads Postgres before the finals.
[job-exec "nightly-finals"]
schedule = 0 0 7 * * *
container = baseball_simulator_v2-jobs-1
user = appuser
command = sh /app/scripts/with_mark.sh nightly-finals sh /app/scripts/with_retry.sh 6 sh /app/scripts/nightly_finals.sh

; SIM-519 Part D: the Sunday sweep of the whole current season, for any final
; game the three-day window missed.
; It starts with the rebuild on Sundays; the rebuild waits for its mark too.
[job-exec "weekly-refresh"]
schedule = 0 0 8 * * 0
container = baseball_simulator_v2-jobs-1
user = appuser
command = sh /app/scripts/with_mark.sh weekly-refresh sh /app/scripts/with_retry.sh 6 sh /app/scripts/weekly_refresh.sh

; The profile + engine-artifact rebuild for the current season, after the
; finals load. It writes the DuckDB file beside the running app: since SIM-524
; (2026-10-10) the app holds no handle on that file, so the writer gets its
; lock. The bundle step ends by publishing a new bundle version (SIM-563); the
; app sees the link move, waits for its run jobs and restarts itself, so the
; rebuilt profiles and bundle reach users the same morning.
; Each job sets `user = appuser`: Ofelia runs an exec as root unless the job
; names a user, and that overrides the container's own user (SIM-563,
; 2026-10-11: a root job left a root-owned bundle version the app could not
; mark). The `jobs` container sets
; BASEBALL_DUCKDB_PATH and OPENBLAS_NUM_THREADS=1 (one numpy math thread per
; process; without it the profile fit took 52 minutes on 2026-10-12, against
; about 12 with it).
[job-exec "nightly-rebuild"]
schedule = 0 0 8 * * *
container = baseball_simulator_v2-jobs-1
user = appuser
; SIM-525: the rebuild runs inside with_mark.sh, so it leaves a running mark.
; The data backup waits on that mark and never opens the DuckDB file while the
; rebuild writes it.
command = sh /app/scripts/with_mark.sh nightly-rebuild sh /app/scripts/with_retry.sh 3 sh /app/scripts/nightly_rebuild.sh

; SIM-525: the nightly backup of the Postgres statistics database. The job runs
; db/backup/pg_backup.sh inside the db container (compose mounts db/backup at
; /opt/baseball/backup). It runs as the postgres OS user and logs in over the
; unix socket, so it needs no password. The script writes one dump set into
; /backups/postgres/ and keeps the newest three.
[job-exec "nightly-backup-postgres"]
schedule = 0 0 10 * * *
container = baseball_simulator_v2-db-1
user = postgres
no-overlap = true
command = sh /opt/baseball/backup/pg_backup.sh

; SIM-525: the nightly backup of the DuckDB analytics file, the engine-artifact
; bundle and the small /data files (pipeline/backup/data_stores.py). It waits
; for the rebuild's mark, then copies each store into /backups/duckdb/ and
; /backups/bundle/ and keeps the newest three sets of each. with_mark.sh leaves
; nightly-backup.last; with_retry.sh reruns it once after a crash.
[job-exec "nightly-backup-data"]
schedule = 0 0 10 * * *
container = baseball_simulator_v2-jobs-1
user = appuser
no-overlap = true
command = sh /app/scripts/with_mark.sh nightly-backup sh /app/scripts/with_retry.sh 2 python -m pipeline.backup.data_stores

; SIM-568: the off-site copy of the backup sets (pipeline/backup/offsite.py).
; It waits for the two 10:00 backups to finish, then copies the newest complete
; set of each store (postgres, duckdb, bundle) from /backups into /offsite. It
; keeps the newest OFFSITE_KEEP sets of each store there (default BACKUP_KEEP,
; else 3). A set counts as complete off-site only once its manifest.json
; lands, last. with_mark.sh leaves nightly-backup-offsite.last; with_retry.sh
; reruns it once after a crash, and the rerun resumes the copy.
[job-exec "nightly-backup-offsite"]
schedule = 0 30 10 * * *
container = baseball_simulator_v2-jobs-1
user = appuser
no-overlap = true
command = sh /app/scripts/with_mark.sh nightly-backup-offsite sh /app/scripts/with_retry.sh 2 python -m pipeline.backup.offsite

; SIM-546: the nightly closing pass. The live pipeline promotes each game's
; closing rows at first pitch; this job runs the historical loader's closing
; pass over yesterday's and the day before's games as the fallback and the
; reconciliation (scripts/nightly_closing_lines.sh). It is its own job, after
; the ingest chain, so a vendor outage never stops the profile and artifact
; rebuild.
;
; It runs INSIDE the running app container (job-exec), not as a fresh one: the
; app service reads the host's .env (env_file), the place for the vendor key
; ODDS_API_KEY. A fresh container reads no .env, so the script would
; exit 1 every night. The key never sits in this file. The command sets
; ODDS_PROVIDER for this one process only: the script runs only on the
; BettingPros provider (the mock must never write closing rows into the real
; store), and the app container does not set it. The container name is the
; docker-compose default (project baseball_simulator_v2, service app, index 1).
;
; Run book: after `docker compose build app` and `docker compose up -d app`
; (the script is baked into the image), check the key is set without printing
; it: docker compose exec app sh -c 'test -n "$ODDS_API_KEY" && echo set'
; Then run the job once by hand and confirm it writes rows:
;   docker compose exec app env ODDS_PROVIDER=bettingpros sh /app/scripts/nightly_closing_lines.sh
; 10:30 UTC since 2026-10-13 (was 09:30): the nightly rebuild ends near 09:26 and the
; app then restarts itself for about 75 s (SIM-563); a job-exec into a restarting
; container fails, and 09:30 left a margin of about two minutes.
[job-exec "nightly-closing-lines"]
schedule = 0 30 10 * * *
container = baseball_simulator_v2-app-1
command = env ODDS_PROVIDER=bettingpros sh /app/scripts/nightly_closing_lines.sh

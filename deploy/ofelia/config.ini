; =============================================================================
; Ofelia scheduler config — nightly data ingestion (docker-native cron).
;
; Used by the docker-compose `scheduler` service (profile: scheduler). Ofelia
; runs each job as a FRESH container off the app image so the heavy batch never
; competes with the live API container.
;
; Schedule format is 6-field cron (sec min hour dom mon dow), UTC. The whole
; refresh→profiles→engine-artifacts chain runs sequentially inside
; nightly_ingest.sh.
;
; The image / network / volume names are the docker-compose defaults derived
; from the project directory name (baseball_simulator_v2). If you rename the
; project dir or set COMPOSE_PROJECT_NAME, update these three lines.
; =============================================================================

[job-run "nightly-ingest"]
schedule = 0 0 7 * * *
image = baseball_simulator_v2-app
network = baseball_simulator_v2_baseball_net
volume = baseball_simulator_v2_duckdb_data:/data
environment = BASEBALL_DB_DSN=postgresql://baseball_user:baseball_pass@db:5432/baseball_sim
environment = BASEBALL_DUCKDB_PATH=/data/baseball_sim.duckdb
command = sh /app/scripts/nightly_ingest.sh

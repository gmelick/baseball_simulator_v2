# =============================================================================
# MLB Baseball Simulation Platform — pyproject.toml
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
asyncio_mode = "auto"

# Collect the standard ``test_*.py`` files PLUS the performance harness's
# ``bench_*.py`` modules (SIM-118). This is additive — normal unit/regression
# test discovery is unchanged; it just also picks up tests/performance/bench_*.py.
python_files = ["test_*.py", "bench_*.py"]

markers = [
    "integration: marks tests as integration tests (require live DB + Redis via testcontainers)",
    "unit: marks tests as unit tests (no external services required)",
    "slow: marks tests as slow (>1s) — excluded from default local run",
    "benchmark: marks tests that use pytest-benchmark",
    "regression: marks tests as regression/golden-file tests (detect engine drift between commits)",
]

addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-q",
]

[tool.ruff]
target-version = "py313"
line-length    = 100
src            = ["api", "pipeline", "similarity", "simulation", "betting", "db", "tests"]

# Markdown is prose, not source. Ruff 0.16 began formatting Python code blocks
# INSIDE .md files, which would rewrite (a) illustrative snippets in README /
# docs/architecture and (b) — the reason this matters — source quoted VERBATIM as
# evidence in docs/audit/*. An audit that quotes the code it is indicting must
# reproduce it exactly; letting a formatter respace it falsifies the evidence.
# Ruff's contract here is the codebase, so keep .md out of its file discovery.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# PTH (flake8-use-pathlib) is intentionally NOT selected: the codebase uses os.path
# pervasively across all phases; enforcing pathlib would mean rewriting dozens of
# (mostly test) files for zero functional gain. The opinionated flake8-simplify
# "nits" in `ignore` below (combine-if / inline-return / contextlib.suppress /
# ternary / single-with) are likewise relaxed — the auto-fixable, higher-signal SIM
# rules stay enforced.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID"]
ignore = ["E501", "B008", "B904", "SIM102", "SIM103", "SIM105", "SIM108", "SIM115", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Tests + standalone scripts legitimately do module-level imports after a sys.path /
# fixture setup block (E402), and use a few patterns the strict rules flag.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "pipeline", "similarity", "simulation", "betting", "db"]

[tool.mypy]
python_version         = "3.13"
strict                 = false
ignore_missing_imports = true
warn_return_any        = false
warn_unused_configs    = true
explicit_package_bases = true
disable_error_code     = ["union-attr", "arg-type", "no-any-return", "operator", "index", "assignment"]
exclude                = ["tests/", "db/migrations/"]

[[tool.mypy.overrides]]
module = "similarity.similarity_diagnostics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "similarity.similarity_calibration"
ignore_errors = true


# ---------------------------------------------------------------------------
# Coverage scope (pytest-cov / coverage.py)
#
# Coverage is measured for similarity/, pipeline/, simulation/, betting/ and
# api/, excluding modules that are pure CLI / diagnostic / real-time
# orchestration scripts, plus integration/E2E-exercised endpoint + real-DB
# modules that the unit suite only mock-touches (so the 80% gate reflects
# unit-testable code, not live-DB/integration paths). simulation/ + betting/
# (SIM-343) and api/ (SIM-376) are measured; entries below are the not-unit-
# covered exceptions.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["similarity", "pipeline", "simulation", "betting", "api"]
omit = [
    "similarity/similarity_calibration.py",
    "similarity/similarity_diagnostics.py",
    "pipeline/etl/venue_backfill_job.py",
    "pipeline/etl/etl_sprint_speed_loader.py",
    "pipeline/etl/opening_line_job.py",
    "*/migrations/*",
    # Live-infra wiring + integration/real-DB paths: exercised by the SIM-371
    # E2E suite + integration tests, not unit tests (same rationale as above).
    "api/main.py",
    "api/state.py",
    "simulation/production_factory.py",
    "simulation/play_pool_sampler.py",
    "pipeline/batch/play_pool_cache.py",
    "api/routes/games.py",
    # SIM-439 Data Lab / Similarity Explorer: live-DB + engine-backed routes,
    # exercised by integration/E2E, not the unit suite (same rationale as
    # games.py). The pure SELECT-only validator (api/routes/sql_safety.py) is
    # NOT omitted — it is unit-tested in tests/unit/test_sql_safety.py.
    "api/routes/analytics.py",
    "api/routes/players.py",
    "api/routes/schema_introspect.py",
    "api/routes/sql_runner.py",
    "api/routes/ai_assistant.py",
    "api/routes/similarity_explorer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

# =============================================================================
# MLB Baseball Simulation Platform — pyproject.toml
#
# Tool configuration only — no build backend (project uses pip + requirements.txt).
# Covers: pytest, ruff, mypy.
# =============================================================================

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
asyncio_mode = "auto"           # pytest-asyncio: all async test functions run as coroutines

markers = [
    "integration: marks tests as integration tests (require live DB + Redis via testcontainers)",
    "unit: marks tests as unit tests (no external services required)",
    "slow: marks tests as slow (>1s) — excluded from default local run",
    "benchmark: marks tests that use pytest-benchmark",
    "regression: marks tests as regression/golden-file tests (detect engine drift between commits)",
]

addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-q",
]

# ---------------------------------------------------------------------------
# ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["api", "pipeline", "similarity", "simulator", "db", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID", "PTH",
]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.isort]
known-first-party = ["api", "pipeline", "similarity", "simulator", "db"]

# ---------------------------------------------------------------------------
# mypy — static type checking
#
# Notes on disabled error codes:
#   union-attr  — pervasive "Item None of Any|None" from the `self._conn`
#                 Optional[Connection] pattern across DB-using modules.
#   arg-type    — numpy ndarray|None passthroughs (engine arrays initialized
#                 lazily; runtime invariant is "always non-None after build()").
#   no-any-return — numpy/pandas/sklearn pervasively return Any.
#   operator    — numpy __radd__ / ufunc overloads vs Optional[ndarray].
#   index       — numpy ndarray|None indexability.
#   assignment  — narrowing assignments from Any.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
warn_return_any        = false
warn_unused_configs    = true
explicit_package_bases = true
disable_error_code     = ["union-attr", "arg-type", "no-any-return", "operator", "index", "assignment"]
exclude                = ["tests/", "db/migrations/"]

[[tool.mypy.overrides]]
module = "similarity.similarity_diagnostics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "similarity.similarity_calibration"
ignore_errors = true

# ---------------------------------------------------------------------------
# Coverage (pytest-cov / coverage.py)
# Scripts and offline-calibration / diagnostics tools are excluded from the
# coverage gate — they ship as CLI utilities, not as library code, and are
# exercised by the regression suite and manual operator runs rather than
# unit tests.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["similarity", "pipeline"]
omit = [
    "similarity/similarity_calibration.py",
    "similarity/similarity_diagnostics.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

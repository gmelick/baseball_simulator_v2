# =============================================================================
# MLB Baseball Simulation Platform — pyproject.toml
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
asyncio_mode = "auto"

# Collect the standard ``test_*.py`` files PLUS the performance harness's
# ``bench_*.py`` modules (SIM-118). This is additive — normal unit/regression
# test discovery is unchanged; it just also picks up tests/performance/bench_*.py.
python_files = ["test_*.py", "bench_*.py"]

markers = [
    "integration: marks tests as integration tests (require live DB + Redis via testcontainers)",
    "unit: marks tests as unit tests (no external services required)",
    "slow: marks tests as slow (>1s) — excluded from default local run",
    "benchmark: marks tests that use pytest-benchmark",
    "regression: marks tests as regression/golden-file tests (detect engine drift between commits)",
]

addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-q",
]

[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["api", "pipeline", "similarity", "simulator", "db", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID", "PTH"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["api", "pipeline", "similarity", "simulator", "db"]

[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
warn_return_any        = false
warn_unused_configs    = true
explicit_package_bases = true
disable_error_code     = ["union-attr", "arg-type", "no-any-return", "operator", "index", "assignment"]
exclude                = ["tests/", "db/migrations/"]

[[tool.mypy.overrides]]
module = "similarity.similarity_diagnostics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "similarity.similarity_calibration"
ignore_errors = true

# ---------------------------------------------------------------------------
# Coverage scope (pytest-cov / coverage.py)
#
# Coverage is measured for similarity/, pipeline/, simulation/ and betting/,
# excluding modules that are pure CLI / diagnostic / real-time orchestration
# scripts. Those modules are exercised by regression and integration tests,
# not unit tests. simulation/ + betting/ added in SIM-343 so the Phase-4
# Monte Carlo sim-loop, validation spine and betting (CLV) code is measured;
# both packages are exercised by tests/unit (26+ sim test modules,
# tests/unit/test_betting_sim339.py) and have no untestable __main__ CLI
# entrypoints, so they are measured in full (no omit entries needed).
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["similarity", "pipeline", "simulation", "betting"]
omit = [
    "similarity/similarity_calibration.py",
    "similarity/similarity_diagnostics.py",
    "pipeline/etl/venue_backfill_job.py",
    "pipeline/etl/etl_sprint_speed_loader.py",
    "pipeline/etl/opening_line_job.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true
